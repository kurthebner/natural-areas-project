- entity_type: Trail
  name_raw: North Country National Scenic Trail
  counties_raw:
  - Multi-state — passes through Putnam County, Ohio via Buckeye Trail Delphos Section
    corridor
  county_primary: Putnam
  ownership_raw: United States of America / National Park Service
  governance_raw: National Park Service
  partner_agencies_raw: North Country Trail Association; Buckeye Trail Association
  coordination_raw: Buckeye Trail Association (co-routes in Ohio); trail volunteers;
    ODNR (canal land)
  difficulty_raw: ''
  accessibility_raw: ''
  trail_use_type_raw: Hiking
  trail_surface_type_raw: ''
  length_raw: ''
  description_raw: 'The North Country National Scenic Trail is the longest trail in
    the National Trails System, stretching approximately 4,800 miles across eight
    states from North Dakota to Vermont. In Ohio, the NCT co-routes with the Buckeye
    Trail for approximately 90% of its ~1,076-mile Ohio course. In Putnam County,
    the NCT follows the Buckeye Trail Delphos Section corridor (46.5 total miles,
    22.7 off-road miles). The Delphos Section passes through Fort Jennings and Ottoville
    in Putnam County before the trail continues north to Junction in Paulding County
    (northern terminus of the Delphos Section). The northern half of the section transitions
    from the canal towpath to county and township roads. Chapter: Miami and Erie Canal
    Chapter (BTA). Page last updated: March 14, 2026 per BTA website.'
  features_raw: ''
  gps_lat_raw: ''
  gps_lon_raw: ''
  urls_raw:
  - https://www.nps.gov/noco/index.htm
  - https://northcountrytrail.org/the-trail/ohio/
  - https://buckeyetrail.org/sections/delphos.php
  identity_notes_raw: 'MC_SUPPLEMENTAL:DEF-T-001 — Existing DB record DEF-T-001 (anchored
    Defiance County) lists counties: Defiance; Henry; Lucas; Paulding but does NOT
    include Putnam. NCT co-routes with BT Delphos Section (PAU-TR-003). BTA Delphos
    Section page (buckeyetrail.org/sections/delphos.php, last updated Mar 14 2026)
    explicitly lists Counties: Auglaize, Allen, Putnam, Paulding and emergency services
    table includes Putnam row (sheriff 419.523.3208). Trail passes through Fort Jennings
    and Ottoville (both Putnam County) before ending at Junction (Paulding County).
    PUT-F-01: DEF-T-001.counties field must be updated to include Putnam at pipeline
    stage. No NCT-specific named segments identified for Putnam County; BT Delphos
    Section is BTA organizational unit (4 counties). Abutting BTA sections: St. Marys
    (south) and Defiance (north). No federal trailheads documented for Putnam County
    portion — access at Fort Jennings and Ottoville likely locally managed.'
  township_raw: ''
  municipality_raw: ''
  discovery_tier: 1
  seeded_from_baseline: false
  baseline_id: ''
