  description_raw: Side Cut is where the Metroparks system began more than 90 years
    ago, and remains a signature Toledo-area destination today. The riverside park
    draws fishermen from around the country as walleye swim upriver to spawn in the
    rapids in late March and April. The flat rocks that extend into the river between
    Maumee and Waterville are known as the Maumee River Ledges, a rare form of a little-known
    habitat called an alvar, found in only a handful of places on the Great Lakes.
    The name 'Side Cut' is derived from the former 'side cut' extension of the Miami
    and Erie Canal that connected the main line of the canal with the city of Maumee.
    Three of the six original locks from the canal system were preserved by WPA workers
    during The Great Depression.
  features_raw: Maumee River Ledges (alvar habitat; rare); Miami and Erie Canal locks
    (3 of original 6, WPA-preserved); Wabash Cannonball Trail; sledding hill; playground;
    indoor and picnic shelters; Windows on Wildlife; fishing; paddling sports; river
    and canal access; Annual Walleye Run event
  urls_raw:
