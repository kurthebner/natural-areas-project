  description_raw: Metzger Marsh Wildlife Area is a 558-acre wildlife area that adjoins
    182 acres of Ottawa National Wildlife Refuge, creating a 740-acre wetland adjacent
    to Lake Erie. A remnant of the 300,000-acre marsh once bordering western Lake
    Erie, the area was purchased by the Division of Wildlife in 1955 after years as
    a private hunting club. The outer dike was restored in 1995. Today it attracts
    thousands of migrating waterfowl, songbirds, and shorebirds annually.
  features_raw: Boat ramp and channel providing Lake Erie access; fishing pier extending
    into Lake Erie; primitive boat ramps along entrance road; parking lot for ice
