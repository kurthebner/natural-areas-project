  description_raw: Declared a refuge in 1938 and a wilderness area in 1975, West Sister
    Island National Wildlife Refuge is located nine miles from shore in the Lake Erie
    Western Basin. This 82 acre island is closed to all access to protect the largest
    nesting colony of wading birds in the United States Great Lakes. Tall hackberry
    trees provide nesting sites for great blue herons, great egrets, black-crowned
    night-herons, double-crested cormorants and more.
  features_raw: Designated Wilderness Area; lighthouse on west end (constructed 1848,
    automated 1937); no public access
  urls_raw:
