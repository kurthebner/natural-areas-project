  description_raw: Promenade Park hosts live musical events for the public, including
    a summer concert series sponsored by Promedica. The park is eight acres and is
    home to boat docks, benches, and a couple of fire pits. It is also home to the
    Echo Sculpture, created by Kristine Rumman and Dane Turpening, composed of eleven
    rings that once were a piece of metal on top of the Edison Steam Plant. Now, they
    are meant to represent the metaphor of Toledo’s transition from past, to present,
    to future. They fade from black to blue to white as a representation of the way
    that the plant used to turn coal into steam for the city.
