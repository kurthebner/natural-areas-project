  description_raw: From birding to baseball to picnicking and fishing, there's something
    for everyone at Pearson. This Metropark is one of the last remaining stands of
    the Great Black Swamp, a notorious forest that once blanketed much of northwest
    Ohio. Buildings, shelters, bridges, ponds and a garden with a waterfall were built
    by workers enrolled in the Works Progress Administration and Civilian Conservation
    Corps during The Great Depression. Nearly 15 miles of trail in this 624-acre park
    provide remarkable access to the best birding anywhere. Portions of Pearson Metropark's
    Black Swamp woods were inducted into the national Old-Growth Forest Network on
    Arbor Day 2026.
  features_raw: 15 miles of trails (multiple named); baseball diamonds; soccer fields;
    tennis courts; fishing; playground; ice skating; sledding; Johlin Cabin (1867);
