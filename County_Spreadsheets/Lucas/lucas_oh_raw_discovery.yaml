  description_raw: Farnsworth is a narrow park along the Maumee River overlooking
    Missionary, Butler and Indian islands, which are owned by the Ohio Division of
    Wildlife. The ruins of the Interurban Bridge, which crosses the river at Farnsworth,
    is a favorite subject of painters and photographers. The iconic bridge is partially
    built atop Roche de Bout, a large, protruding rock in the river that served as
    an early landmark for native people, European explorers and armies. The Towpath
    Trail, which is part of the Buckeye Trail (marked with blue blazes), follows the
    remains of the Miami and Erie Canal along the old towpath where mules once towed
    flat-bottom boats along the waterway. The 8-mile trail connects Providence, Bend
    View and Farnsworth Metroparks.
  features_raw: Towpath Trail (southern terminus; 8 miles to Providence); camping;
    fishing; kayak concession rental (call 419-340-0823); historic WPA buildings and
    bridges; Interurban Bridge ruins; Roche de Bout landmark rock; indoor and picnic
    facilities; playground
