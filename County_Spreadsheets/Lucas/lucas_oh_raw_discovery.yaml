  description_raw: Campbell State Nature Preserve honors Louis W. (Lou) Campbell,
    a well-known Toledo naturalist and outdoor writer. High quality habitats include
    wet sedge meadows, swamp forest, sand dunes, sand barrens, mesic sand prairie
    and oak openings. These habitats support endangered wildlife including the frosted
    elfin and harvester butterflies. Rare wildflowers seen here include wild lupine,
    grass-pink orchid, spathulate-leaved sundew, soapwort gentian, plains puccoon
    and Missouri ironweed.
  features_raw: 2.3 miles of hiking trails; wet sedge meadow; swamp forest; sand dunes;
    sand barrens; mesic sand prairie; oak openings; no restrooms; no pets permitted
  urls_raw:
  - https://ohiodnr.gov/go-and-do/plan-a-visit/find-a-property/campbell-state-nature-preserve
