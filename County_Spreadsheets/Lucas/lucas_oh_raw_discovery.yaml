  description_raw: Camp Miakonda at the DeVilbiss Scout Reservation is a 160 acres
    resident-type facility for Scouting groups. The DeVilbiss Scout Reservation is
    the 5th oldest Scouting America camp in the United States. Fourteen rustic cabins
    are available for rental. Four Adirondack sites (3-sided buildings), tent camping
    sites, a pool, a lake, chapel, dining hall (with food service operation), Trading
    Post, Historical Museum, a marked historical trail, and Fort Scheib are also on-premises.
    The Council Lodge, Ford Center, and Wildlife Center are available for day, evening,
    or weekend use for special events, dinners, training seminars, etc. for both Scout
    and non-Scout groups. Ohio's oldest and America's 5th oldest surviving Scout camp.
  features_raw: 14 rustic cabins; 4 Adirondack sites; tent camping; swimming pool;
    10-acre lake; chapel; dining hall (food service); Trading Post; Historical Museum
    (1917 building; oldest standing Scouting America camp building in the nation);
    Fort Scheib; Council Lodge; Ford Center; Wildlife Center; historical trail; orienteering
    trail; BMX biking; shooting sports; fishing; nature and wildlife education; Scouting
    memorabilia museum; historical marker; restrooms; parking
