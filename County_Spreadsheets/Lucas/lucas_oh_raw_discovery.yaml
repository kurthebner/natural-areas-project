  description_raw: Once home to a 1,000-acre farm (formerly Springer Farm), almost
    100 acres of this land is being restored to a rich habitat for birds, frogs and
    turtles. For people, a bicycle, kayak or tent is the best way to truly experience
    this Metropark beside the region's longest trail. The park has planted prairies,
    a pond for boating, three campsites secluded in the woods, walking paths and a
    connection to the Wabash Cannonball Trail, which runs through the park. Built
    in 1855, the northern leg of the Wabash Railroad ran from Toledo to Chicago until
    1969; in the mid-1990s it became a rails-to-trails bicycle trail.
