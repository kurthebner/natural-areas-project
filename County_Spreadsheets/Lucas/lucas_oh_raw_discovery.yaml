  acres_raw: 2,202
  description_raw: Magee Marsh Wildlife Area is a 2,202-acre controlled hunting area
    containing some of Ohio's finest remaining wetlands. Originally private hunting
    clubs from the late 1800s, the area was purchased by the Ohio Division of Wildlife
    in August 1951. The marsh complex is renowned for its waterfowl, waterbirds, shorebirds,
    and songbirds. A forested beach ridge provides critical habitat for over 150 migrating
    songbird species including 36 species of warblers. More than 300 bird species
    have been recorded on the area.
  features_raw: Accessible boardwalk through beach ridge; newly renovated visitor
    center; Turtle Creek fishing access (boat ramp and parking); parking for ice fishing
    on Lake Erie; controlled hunting (lottery); trapping; bald eagle viewing; waterfowl
    hunting (Oct-Dec restricted hours)
  urls_raw:
