  acres_raw: '5000'
  description_raw: Oak Openings Preserve is the largest of the Metroparks — by far
    — at 5,000 acres. The park takes its name from the surrounding region, which is
    23 times larger. The natural habitats in the park range from oak savanna to wetlands
    to vegetated sand. The Nature Conservancy once named the sandy region one of the
    200 'Last Great Places on Earth.' Prickly-pear cactus, wild lupine and sand cherry
    bloom atop dry, hot dunes just yards away from orchids thriving in low, wet swales.
    Oak Openings is a birder's paradise and is the nesting place of bluebirds, indigo
    buntings, whippoorwills, lark sparrows and many other species. There are more
    than 70 miles of trail in the preserve, including a network of horse trails, a
    dedicated cross-country ski trail and a popular singletrack mountain bike trail.
  features_raw: '70+ miles of trails; two campgrounds (White Oak and Springbrook);
