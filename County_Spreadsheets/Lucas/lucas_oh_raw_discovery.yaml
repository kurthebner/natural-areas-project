  description_raw: Blue Creek is a quiet country retreat where visitors can walk a
    looped trail through a wetland and around a quarry pond, fish, kayak, sled or
    have a family gathering. Located on the edge of the Oak Openings Region, Blue
    Creek was the site of limestone quarries in the mid- to late-1800s. In 1917, the
    city of Toledo bought the land to build a prison farm (Toledo House of Corrections
    / 'The Workhouse'). Blue Creek is home to the Metroparks native plant nursery
    where plants and trees are reared to support the park system's habitat restoration
    projects across Lucas County.
