  - https://www.rbhayes.org/estate/spiegel-grove/
  identity_notes_raw: 'Dual designation: Ohio State Park (ODNR) and Ohio State Memorial
    (OHC). Managed by Hayes Presidential Center, Inc. under OHC ownership. National
    Historic Landmark (1964); NRHP (1966). Admission charged. No named trail confirmed
    from authoritative sources; secondary source cites approx. 1 mile paved trails;
