  location_raw: 3451 Co Rd 256, Vickery, OH 43464; between south shore of Sandusky
    Bay and U.S. Route 6, Townsend and Riley townships, Sandusky County
  description_raw: The majority of the acreage has been restored to wetlands with
    the remainder in woods, brush, and native grassland. Division of Wildlife acquired
    Pickerel Creek Wildlife Area in 1987. Managed as a public hunting, fishing, trapping,
    and wildlife observation area with emphasis on waterfowl and other wetland wildlife.
    Pickerel Creek flows through the western half of the area, forming a high quality
    freshwater estuarine habitat. One of the best shorebird areas in the state during
    migration. About 7 miles east of Fremont; about 8 miles north and west of Castalia.
  features_raw: Observation deck (year-round, along SR 6); Multiple parking areas
    (along SR 6 and TR 680); Network of dikes throughout wetlands; Old Vickery Road
    (abandoned road bisecting marsh); No restroom facilities; No parking fees
  difficulty_raw: null
  accessibility_raw: Observation deck accessible; no restrooms on site
  urls_raw:
  - https://ohiodnr.gov/go-and-do/plan-a-visit/find-a-property/pickerel-creek-wildlife-area
  identity_notes_raw: 'Acreage discrepancy: ODNR official 3,200 ac; OOS cites 2,814
    ac; use 3,200 per ODNR. Access to Sandusky Bay limited to boating down Pickerel
    Creek from US Route 6. Controlled waterfowl hunting; trapping rights by special
    drawing. Dike network and Old Vickery Road are informal trail-type features; no
    named trails in ODNR materials. No ODNR scenic river designation for Pickerel
    Creek.'
  township_raw: null
  municipality_raw: null
  discovery_tier: 2
  seeded_from_baseline: true
  baseline_id: Pickerel Creek Wildlife Area
