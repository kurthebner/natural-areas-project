  description_raw: The site of the nations first presidential library includes the
    31-room Victorian mansion of the 19th U.S. president, a two-story museum, and
    the burial site of President Hayes and First Lady Lucy Webb Hayes, all within
    Spiegel Grove estate. Originally built c. 1860; expanded 1880 and 1889 to over
    30 rooms and 10,000 sq ft. Wooded grounds with arboretum; deeded to State of Ohio
    by Col. Webb C. Hayes after presidents death in 1893.
  features_raw: Hayes Home (31-room Victorian mansion); Museum; Research Library;
    Arboretum (ArbNet Accredited Level 1); White House Gates; Graves of President
    and First Lady Hayes; Burial site of Old Whitey (Hayes Civil War horse); Picnic
    tables; Grills and fire pits; Open fields; Pavilion rentals; Playground; Hiking/walking
    trails (approx. 1 mile paved); Fishing pond
  difficulty_raw: null
  accessibility_raw: null
  urls_raw:
