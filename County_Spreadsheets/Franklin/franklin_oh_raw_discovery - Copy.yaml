  Metro Parks manages only the section within Three Creeks Metro Park. Tier 3 notation for
  Metro Parks connection; canonical tier assignment is Tier 6 (Columbus). Flagged for Tier 6
  discovery session to record as primary Tier 6 entity. OTET SEGMENT: Alum Creek Trail is
  part of the Ohio to Erie Trail statewide system. Connects to Blacklick Creek Greenway
  at Three Creeks Metro Park.
