tier_result:
  tier: 1
  governance_level: Federal & Tribal
  result: null
  entities_found: 0
  sources_checked:
    - NPS National Natural Landmarks index (Ohio): https://www.nps.gov/subjects/nnlandmarks/index.htm
    - NPS Find a Park (Ohio): https://www.nps.gov/findapark/index.htm
    - USFWS National Wildlife Refuges (Ohio): https://www.fws.gov/locations
    - US Army Corps of Engineers, Huntington District: https://www.lrd.usace.army.mil/
    - USDA Forest Service Wayne National Forest: https://www.fs.usda.gov/r09/wayne
    - BLM Northeastern States: https://www.blm.gov/office/northeastern-states
    - Ohio federally recognized tribes via USFS tribal relations list
  notes: >
    No federally owned or managed natural area lands identified in Franklin County.
    Detailed findings by agency:

    NPS: No NPS park units in Franklin County. Two National Natural Landmark
    designations apply to lands within or bordering Franklin County —
    Blacklick Woods Metro Park (NNL designated 1974; primarily Franklin County,
    spans into Fairfield County) and Highbanks Metro Park (NNL designated 1980;
    primarily Delaware County, spans into Franklin County). Both are managed by
    Metro Parks Serving Franklin County (Tier 3), not by the federal government.
    NNL designation will be recorded in the designation field at Tier 3.

    The Ohio & Erie Canalway National Heritage Area (NPS, designated 1996)
    covers Franklin County, but the heritage area itself is not federally owned
    or managed land — it is a congressional designation with local partnership
    management. The Towpath Trail within Franklin County is managed by local
    entities. This will be recorded at the appropriate management tier.

    USACE: The Franklinton Floodwall is flood control infrastructure, not a
    natural area. Griggs and O'Shaughnessy Reservoirs are owned and managed by
    the City of Columbus for water supply; federal involvement is historical
    and indirect. Not natural area entities.

    USFWS: All three Ohio National Wildlife Refuges are in Ottawa County.
    No refuges in Franklin County.

    USFS: Wayne National Forest is in southeastern Ohio. No USFS land in
    Franklin County.

    BLM: No BLM surface lands in Franklin County or anywhere in Ohio.

    Tribal: No federally recognized tribal lands in Franklin County or anywhere
    in Ohio. All tribes with ancestral ties to the region are headquartered
    in other states.


