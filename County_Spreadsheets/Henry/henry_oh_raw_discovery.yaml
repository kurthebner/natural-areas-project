- run_id: henry_oh_2026_04_20
  tier: 4
  entity_type: Trail
  name_raw: Miami & Erie Canal Towpath Hiking Trail
  governance_raw: Henry County Park District
  governance_notes_raw: All-volunteer organization organized 2005; operates out of
    Henry County Office Complex, 1853 Oakwood Avenue, Napoleon, Ohio 43545 (county
    commissioner address). Holds lease agreements with State of Ohio for state-owned
    canal lands across Henry County. Not a formal ORC Chapter 1545 park district;
    county-affiliated volunteer entity.
  counties_raw:
  - Henry County
  - Defiance County
  - Wood County
  address_raw: ''
  location_raw: Adjacent to Maumee River; runs east-west across Henry County along
    former Miami & Erie Canal route. Western terminus near Independence Dam State
    Park (Defiance/Henry county line); eastern terminus near Providence Dam Metropark
    (Wood County).
  length_raw: ''
  difficulty_raw: Hiking/biking trail; surface and difficulty not specified by source
  surface_raw: ''
  description_raw: The former Miami and Erie Canal Towpath is being converted into
    a hiking/biking trail adjacent to the Maumee River. This effort represents the
    first time the Canal Lands have been cleared and used for the public benefit since
    the canals were abandoned in the nineteenth century. The trail is part of 'The
    Buckeye Trail' — the longest loop trail in the United States — which encircles
    the State of Ohio and covers approximately 1444 miles. The trail is also part
    of the North Country Trail, one of the seven National Park Service trails.
  features_raw:
  - Hiking
  - Biking (planned)
  - Adjacent to Maumee River
  - Former Miami & Erie Canal route
  - Co-routes with Buckeye Trail
  - Co-routes with North Country Trail
  urls_raw:
  - http://henrycountyparks.blogspot.com/
  - http://henrycountyparks.blogspot.com/p/trail-maps.html
  - http://www.henrycountyparks.org
  cross_references_raw:
  - Buckeye Trail — already staged in DEF run as multi-county Trail; canal towpath
    co-routes with BT through Henry County
  - North Country Trail — already staged in DEF run as multi-county Trail; canal towpath
    co-routes with NCT through Henry County
  - 'MJTSP Tow Path (T2 entity #11) — 0.3-mile ODNR-managed segment within Mary Jane
    Thurston SP is a segment of this route'
  identity_notes_raw: Multi-county trail. Managed by Henry County Park District on
    state-owned canal lands leased from Ohio. GIS_VERIFY_COUNTY — confirm full Henry
    County extent and segment termini.
  flags_raw:
  - GIS_VERIFY_COUNTY
  - MULTI_COUNTY
  discovery_source: http://henrycountyparks.blogspot.com/p/about-us.html
  discovery_source_label: Henry County Parks — About Us (blogspot)
  discovery_date: '2026-04-21'
  discovery_tier: 4
