  location_raw: Maumee River corridor — runs through Defiance, Henry, Wood, and Lucas
    Counties, Ohio
  description_raw: The Maumee State Scenic River is designated under the Ohio Scenic
    Rivers Program. Referenced on Mary Jane Thurston State Park property page as 'the
    historic Maumee State Scenic River.' The Maumee River flows northeast from Defiance
    through Henry County (passing through the Napoleon and McClure areas) and on to
    Toledo. ODNR Scenic Rivers Program web page returned no readable content (JS-rendered,
    no static data available).
  features_raw: ''
  gps_lat_raw: ''
  gps_lon_raw: ''
  urls_raw:
  - https://ohiodnr.gov/discover-and-learn/land-water/scenic-rivers/maumee-scenic-river
  - https://ohiodnr.gov/discover-and-learn/land-water/scenic-rivers
  identity_notes_raw: 'CATEGORY: Water Site. SUBTYPE: River. DESIGNATION: State Scenic
    River. Per state discovery subproc §3.5 and §4.6, scenic river designations are
    Sites (category=Water Site, subtype=River, designation=State Scenic River), NOT
    Site Networks. Multi-county entity: flows through Defiance, Henry, Wood, and Lucas
    Counties. GIS_VERIFY_COUNTY — precise designated reach boundaries need GIS confirmation.
    ODNR Scenic Rivers Program page is JS-rendered; no static description text available
    at fetch time. Source confirmation: MJTSP property page explicitly names ''the
    historic Maumee State Scenic River.'' Overlap note: Maumee River Water Trail (staged
    in Defiance run as separate Trail entity) runs within/along this scenic river
    corridor — see DEF run cross-reference. Per §4.6 of state subproc: overlapping
    trail and scenic river Site are related but distinct entities; flag for resolution.'
