  description_raw: Situated along the historic Maumee State Scenic River, Mary Jane
    Thurston State Park's 105 acres offer a variety of day-use and overnight activities.
  features_raw: Archery range; boat launch ramp (1); marina; camping - electric hookup;
    camping - primitive/tent; Day Lodge (seats 50); fishing; hunting - shoreline trapping
    and waterfowl; hunting - archery; picnicking - 2 areas along river; trails (Storybook
    Trail, Blue Trail, Orange Trail, Tow Path, Yellow Trail)
  gps_lat_raw: ''
  gps_lon_raw: ''
  urls_raw:
  - https://ohiodnr.gov/go-and-do/plan-a-visit/find-a-property/mary-jane-thurston-state-park
  identity_notes_raw: 'ACREAGE CONFLICT: ODNR property page states 105 acres; baseline
    seed and OSM record 591 acres. Record ODNR-stated value (105) in acres_raw; resolution
    engine to arbitrate. Park named after Mary Jane Thurston, who bequeathed 14 acres
    in 1928; park dedicated 1968. Phone: (419) 832-7662. Manager: Jeremy Babcock.
    The Tow Path trail (0.3 mi within park) continues into Grand Rapids village (Wood
    County) — Tow Path is a multi-county trail; only the MJTSP segment is staged at
    T2 here. NCT co-routes with Buckeye Trail along Miami & Erie Canal Towpath through
    this park area — see DEF run cross-reference for NCT staging.'
