  identity_notes_raw: 'The Maumee River was designated an Ohio State Scenic River on July 18, 1974: scenic section = Ohio/Indiana
    state line to Defiance (43 river miles); recreational section = Defiance downstream to Maumee/Perrysburg Bridge (53 river
    miles). The Maumee River Water Trail branded route is distinct from the scenic river regulatory designation but substantially
    overlaps it. Managed cooperatively by ODNR and Metroparks Toledo. Independence Dam State Park is a named access point
