  location_raw: 27722 County Rd 424, Defiance, Ohio 43512; approximately 3 miles east of Defiance on the Maumee River
  description_raw: Located on the banks of the Maumee River, the park features ruins of the Miami and Erie Canal and a three-mile
    hiking trail following the historic canal towpath that meanders between the old canal and the river through a dense hardwood
    forest. Over 200 bird species have been recorded. The park is along the Maumee State Scenic River.
  features_raw: Primitive camping (tent only, April 1–Oct 31); boat launch (4-lane); marina; picnic shelters (reservable);
    hiking trail; hand-launch area; pit latrines; fire rings; picnic tables; Lock Number 13 ruins (Miami and Erie Canal)
  gps_lat_raw: ''
  gps_lon_raw: ''
  urls_raw:
  - https://ohiodnr.gov/go-and-do/plan-a-visit/find-a-property/independence-dam-state-park-campground
  - https://www.stateparks.com/independence_dam_state_park_in_ohio.html
  - https://en.wikipedia.org/wiki/Independence_Dam_State_Park
  - https://dam.assets.ohio.gov/image/upload/ohiodnr.gov/documents/parks/parkmaps/independenceparkmap.pdf
  identity_notes_raw: 'Independence Dam (the physical dam) completed 1924 in concrete, replacing earlier wooden structure;
    11.8 ft high, 652 ft long; state-regulated infrastructure associated with the park. NID baseline seed ''Independence Dam
    (NID)'' resolves to the park''s impoundment dam — not a separate Site entity. Park established 1949 by Ohio Dept of Public
    Works (later ODNR). Maumee State Scenic River designation applies to this stretch (state-to-Defiance = scenic section;
    downstream = recreational section). Buckeye Trail / North Country NST routes through park along canal towpath. Winchester''s
    Camp No. 3 (ODNR Historic Site #24) is located within the park — see child Site record. Phone: (419) 237-2593 (per stateparks.com)
    / (419) 956-1368. CONFIRM: 25 vs 40 primitive campsites (sources conflict). Baseline seeds confirmed: ''Independence Dam
    State Park'', ''Independence Dam (NID)''.

    '
