  location_raw: 10485 Haller Road, Defiance, OH 43512
  description_raw: '250-acre wildlife reserve encompassing various ecosystems including wetlands, prairie, hardwood forest,
    and old growth forest. Launched by the Diehl Family Foundation in 1989 as a land restoration initiative; opened to public
    in 2020. Located along Haller Road near Nobel Elementary School. Features interpretive signage with quotations from naturalist
    H.D. Thoreau. An Audubon Sanctuary Program partner supporting nesting bluebirds, wood ducks, and mallard ducks. Visitors
    enter via gravel lane to parking area. Seasonal restroom facility (March–November) near parking lot; nature center by
    Walden Pond currently unavailable.

