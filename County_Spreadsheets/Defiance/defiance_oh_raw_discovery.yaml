  description_raw: The longest trail in the National Trails System, the North Country National Scenic Trail stretches approximately
    4,800 miles across eight states from North Dakota to Vermont. In Ohio, the trail joins and shares the route of the Buckeye
    Trail for approximately 90% of its ~1,076-mile Ohio course, following canal towpaths, river corridors, and historic routes
    through northwest and central Ohio.
  location_raw: Passes through Defiance County, Ohio; follows Maumee River corridor; routes through downtown Defiance, through
    Pontiac Park, and through Independence Dam State Park along the Miami and Erie Canal towpath
  gps_lat_raw: ''
  gps_lon_raw: ''
  urls_raw:
  - https://www.nps.gov/noco/index.htm
  - https://northcountrytrail.org/the-trail/ohio/
  - https://en.wikipedia.org/wiki/North_Country_Trail
  identity_notes_raw: 'In Ohio, the NCT is co-routed with the Buckeye Trail (Buckeye Trail Association) for ~90% of its Ohio
    mileage. The shared Ohio route is ~1,076 miles total. Within Defiance County, the trail enters the city of Defiance, follows
    sidewalk along tree-lined streets, crosses the Maumee River, turns east through Pontiac Park, continues on-road, and then
    routes through Independence Dam State Park following the old Miami and Erie Canal towpath past Lock Number Thirteen ruins.
    The ''Defiance Section'' (55 miles across Paulding, Defiance, Henry, and Lucas Counties) is a Buckeye Trail Association
    section designation, not an NCT-specific named segment — no NCT-specific segment names documented for Defiance County.
    Trail is multi-county and multi-state; this record captures Defiance County presence. NCT confirmed through Pontiac Park
    — partially resolves flag DEF-F-02 (Pontiac Metro Park governance: trail evidence supports municipal park in or adjacent
    to City of Defiance; verify in Tier 5). Access points for the NCT within Defiance County (trailheads at Independence Dam
    SP and city parks) will be documented at Tier 2 (SP) and Tier 5 (city).

    '
  township_raw: ''
  municipality_raw: ''
  discovery_tier: 1
  seeded_from_baseline: false
  baseline_id: ''
