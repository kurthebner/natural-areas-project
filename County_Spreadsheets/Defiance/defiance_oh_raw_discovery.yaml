    connecting five Metroparks, three state parks (including Independence Dam State Park), three wildlife areas, and 15 other
    public parks at 39 access locations across Paulding, Defiance, Henry, Wood, and Lucas counties.
  location_raw: Maumee River corridor, northwest Ohio; passes through Defiance County
  gps_lat_raw: ''
  gps_lon_raw: ''
  urls_raw:
