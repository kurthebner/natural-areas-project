  acres_raw: ''
  location_raw: Four miles east of the City of Defiance on US Route 424 on the bank of the Maumee River, within Independence
    Dam State Park
  description_raw: War of 1812 winter encampment site (Nov. 2, 1812 – Jan. 1, 1813) for three Kentucky Militia Regiments and
    one regiment of US Regulars under Colonel Wells, stationed approximately six miles below Fort Winchester on the north
    bank of the Maumee River. Nicknamed 'Fort Starvation' by soldiers due to supply shortages. Believed burial site of approximately
    300 Kentucky soldiers; thousands of bones were disturbed when the Miami and Erie Canal was dug through the burial ground
    (1837–1848) and reinterred. Historical marker erected 2010 by Defiance County Chapter Ohio Genealogical Society and other
    organizations.
  features_raw: Historical marker
  gps_lat_raw: ''
  gps_lon_raw: ''
  urls_raw:
  - https://www.hmdb.org/m.asp?m=37924
  - https://www.defiancecountygenealogy.org/Military/Kentucky.html
  identity_notes_raw: 'ODNR Historic Site #24. Also known as ''Old Kentucky Burial Grounds.'' Located within Independence
    Dam State Park. The historical marker also references ''The Old Kentucky Burial Grounds.'' Two distinct names in active
    use: ''Winchester''s Camp No. 3'' (ODNR designation) and ''Fort Starvation'' (soldiers'' nickname). Baseline seed confirmed:
    ''Winchester''s Camp No. 3 / Fort Starvation (ODNR Historic Site #24, inside Independence Dam SP)''. DEF-F-09 resolved:
    confirmed as child historic site within Independence Dam SP.

    '
