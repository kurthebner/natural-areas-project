  description_raw: 'Forrest Woods State Nature Preserve is one of the highest-quality
    remnants of the historic Great Black Swamp in northwest Ohio. Black Swamp Conservancy''s
    largest owned nature preserve. The site contains mature upland and floodplain
    forest with 39+ rare, threatened, and endangered plant and animal species. Portions
    dedicated as a State Nature Preserve by ODNR DNAP in 2008. Access is restricted
    — not a public open-access preserve. Active restoration efforts by BSC ongoing.

    '
  location_raw: County Road 73, just north of Forder's Bridge, Paulding County, Ohio
