  description_raw: 'The Maumee River Water Trail is a 107-mile designated water trail
    along the Maumee River from the Ohio-Indiana state line to Lake Erie. The trail
    passes through Paulding, Defiance, Henry, Wood, and Lucas counties. In Paulding
    County, the trail includes the scenic portion of the Maumee River — the Scenic
    Maumee River designation covers approximately 43 miles from the Indiana state
    line to the US 24 bridge west of Defiance. The trail is a partnership of Toledo
    Metroparks, ODNR, and Defiance SWCD, with branding and brochures managed by Toledo
    Metroparks. The trail has 39 access points total; Paulding County access points
    include Cecil Bridge (at Cecil Bridge Park, PCPD), Forder Bridge area (BSC-owned),
    and Antwerp Riverside Park (Village of Antwerp).

    '
  identity_notes_raw: 'Water trail; entity type is Trail with use_type = Water Trail.
    Access point entities for the Paulding County segment to be staged at their respective
    tiers: Cecil Bridge Park water trail access (Tier 4/PCPD); Forder Bridge (Tier
    7/BSC); Antwerp Riverside Park (Tier 6/Municipal). Maumee Valley Heritage Corridor
    (nonprofit, Tier 7) manages the Maumee River Scenic Byway designation — a separate
    heritage designation from this water trail.

    '
  notes_raw: 'Trail brochure: metroparkstoledo.com. 39 access points total along 107-mile
    route.'
