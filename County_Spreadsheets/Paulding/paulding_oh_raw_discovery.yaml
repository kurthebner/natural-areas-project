  description_raw: 'The North Country National Scenic Trail is a federally designated
    trail spanning approximately 4,800 miles from Crown Point, New York to Lake Sakakawea
    State Park, North Dakota. It is administered by the National Park Service. In
    Ohio, the NCT co-routes almost entirely with the Buckeye Trail (BTA), sharing
    approximately 1,076 miles. In Paulding County, the NCT follows the Miami and Erie
    Canal towpath through the county via the Buckeye Trail''s Delphos Section (through
    southeast Paulding County) and the Defiance Section (starting at Junction, Ohio
    — the historic junction of the Miami-Erie Canal and the Wabash-Erie Canal — and
    continuing north and west through the county). Canal Park (Paulding County Park
    District) at Junction serves as a primary access point.

    '
  identity_notes_raw: 'Multi-state trail network. Paulding County member trail IDs
    pending — BTA Delphos Section and BTA Defiance Section will be staged at Tier
    7 (BTA = conservancy). Member trail IDs to be updated after Tier 7 discovery.
    NCT and BT diverge at River Road (Defiance Section Point 20) after co-routing
    for 52 miles; NCT continues north, BT continues east.

    '
  notes_raw: 'NCT Paulding County access points: (1) Canal Park / Junction — start
    of Defiance Section, historic canal junction, maintained by PCPD; (2) Viall''s
    Lock Campsite — primitive campsite off Road 163 in Paulding County, between Delphos
    Section Points 22-23, no facilities. Buckeye Trail is NOT federally designated
    as of 2026-04-07; NPS feasibility study for National Scenic Trail designation
    is ongoing (study expected to conclude 2026). BT trail entities (Delphos Section,
    Defiance Section) staged at Tier 7.

    '
  url_raw: https://www.nps.gov/noco/index.htm
  maps_raw: https://www.nps.gov/noco/planyourvisit/maps.htm
  source: NPS NOCO website; Buckeye Trail Association sections pages; web search results
    2026-04-07
  baseline_seed: false
  discovery_date: 2026-04-07
