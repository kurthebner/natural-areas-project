  description_raw: 'The Miami and Erie Canal Towpath follows the historic towpath
    of the Miami and Erie Canal, completed from Cincinnati to Toledo between 1825
    and 1845. The canal land is owned by the State of Ohio (ODNR), transferred to
    ODNR in the mid-1980s. In Paulding County, the towpath forms the physical trail
    used by the Buckeye Trail (Delphos Section, running through the southeast part
    of the county) and continues to Canal Park at Junction — the northern terminus
    of the Miami and Erie Canal, where it historically joined the Wabash-Erie Canal.
    The Buckeye Trail/North Country Trail co-route on the towpath through this county.

    '
  identity_notes_raw: 'The Miami & Erie Canal Towpath ends at Junction, Paulding County
    (Canal Park). North of Junction the BT/NCT follows the former Wabash-Erie Canal
    corridor. Towpath land is ODNR-owned (state); trail management varies by segment.
    The BT Delphos Section and BT Defiance Section use this corridor in Paulding County
    — those trail entities staged at Tier 7. Canal Park (the northern terminus access
    point) is a PCPD park — Tier 4.

    '
  notes_raw: ODNR has Miami & Erie Canal maps including Paulding County segment.
  url_raw: https://ohiodnr.gov/discover-and-learn/safety-conservation/about-ODNR/real-estate/ohio-canal-maps/miami-erie-canal-maps
