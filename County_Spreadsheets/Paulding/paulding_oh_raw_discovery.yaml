    canal towpath, farmland, and small towns. The Delphos Section begins on the Miami
    and Erie Canal towpath and continues through Spencerville and Delphos. The Paulding
    County portion follows the M&E Canal towpath corridor. The section ends at Junction,
    Ohio (Point 1 of the Defiance Section), where the Delphos and Defiance Sections
    transition. Includes Viall''s Lock Campsite (primitive, no facilities) in Paulding
    County.

