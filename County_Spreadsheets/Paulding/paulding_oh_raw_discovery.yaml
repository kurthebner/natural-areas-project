  description_raw: 'Black Swamp Nature Center (BSNC) is a 51-acre county-owned natural
    area and nature center facility managed by the Paulding Soil & Water Conservation
    District. The property consists of approximately 24 acres of woodland, 14 acres
    of wetlands, and 6 acres of meadow along Flat Rock Creek. Features include a boat
    launch providing access to Flat Rock Creek, trails winding along three ponds,
    the site of a former Sugar Beet dam, the nature center building (available for
    programming and rental), and parking. The Paulding County Fairgrounds borders
    the property on the northeast with two additional access trails. The site was
    originally ODNR Paulding Ponds Wildlife Area, transferred to Paulding County Commissioners
    in 1994, and subsequently developed into the current nature center.

    '
  location_raw: '753 Fairground Drive (also: 451 McDonald Pike), Paulding, Ohio 45879;
    south of courthouse square via Williams Street, west of fairgrounds'
