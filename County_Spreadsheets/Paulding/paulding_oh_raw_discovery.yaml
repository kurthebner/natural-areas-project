  description_raw: 'A 54-acre conservation property along the Maumee River in Paulding
    County purchased by Black Swamp Conservancy in 2016. Former agricultural land
    restored to native floodplain habitat. H2Ohio project installed approximately
    4 acres of wetland restoration and repaired two on-site streams, preventing approximately
    160 lbs phosphorus and 645 lbs nitrogen annually from entering the Maumee River.
    Motor vehicles prohibited on property; walk-in access from designated parking
    lot. Official Maumee River Water Trail access point at Forder Bridge. No camping
    permitted.

    '
