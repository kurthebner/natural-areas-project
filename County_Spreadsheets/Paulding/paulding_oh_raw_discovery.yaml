  description_raw: 'Fort Brown Park is located at the confluence of the Big Auglaize
    and Little Auglaize Rivers, one mile south of Charloe on Road 171. The Paulding
    County Park District accepted maintenance responsibility in 2019. The park is
    divided by County Road 171, with river access and a fishing area on the east side
    where the Little Auglaize drains into the Auglaize River. A bench donated by Friends
    of the Paulding County Parks overlooks the Little Auglaize. A future small craft
    boat launch is planned. The site has significant historical significance: Fort
    Brown was built here by General William Henry Harrison during the War of 1812
    to protect supply shipments on the Auglaize River. Named for Colonel Brown who
    commanded the stockade. A monument erected in 1953 marks the site. By local tradition,
    three soldiers from the era are buried at this site.

    '
  location_raw: 9597 Rd. 171, Oakwood, Ohio; 1 mile south of Charloe on Rd. 171, confluence
    of Big Auglaize and Little Auglaize Rivers, Brown Township, Paulding County
