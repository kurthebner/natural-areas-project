  description_raw: 'A 652-acre private fee-access hunting preserve in Paulding County,
    Ohio, located on County Road 60 in Grover Hill. Opened in 1996 by Brad Dysinger.
    Features wetlands, brush piles, oxbows, woods, and food plots maintained exclusively
    for hunting. Pheasant hunting operation. Season runs October 1 through March 15
    (closed Christmas and Ohio deer gun week). Groups are assigned exclusive hunting
    areas ranging from 25 to 160 acres per outing.

    '
