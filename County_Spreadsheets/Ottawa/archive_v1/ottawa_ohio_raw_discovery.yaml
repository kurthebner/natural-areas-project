  description_raw: North Bass Island State Park occupies 593 acres (67% of North Bass
    Island / Isle St. George) in Put-in-Bay Township. State of Ohio purchased 589
    acres of the island in 2004 to preserve it from development. Park offers primitive
    camping (3 sites, first-come first-served), Lake House (4-bedroom seasonal accommodation),
