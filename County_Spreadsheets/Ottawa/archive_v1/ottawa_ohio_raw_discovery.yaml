  description_raw: Lakeside Daisy State Nature Preserve protects the only natural
    U.S. population of the Lakeside Daisy (Hymenoxys herbacea), a federally threatened
    plant species. Original preserve is 19 acres; an adjacent 118-acre expansion was
    purchased to create a total 137-acre preserve. Located on the Marblehead Peninsula.
    Visitors can explore walkable trails (including wheelchair-accessible options).
    ODNR staff lead guided tours during peak bloom (early to mid-May). The preserve
    also features some of the most extensive glacial grooves and best-preserved alvar
    habitat in northern Ohio. Permit may be required for some areas.
