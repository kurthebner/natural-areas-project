    bluffs up to 40 feet high. Amenities include cobble beach, boat ramp, fishing
    pier, campground (59 electric, 10 full-service, 57 non-electric sites, 3 cabents),
    picnic facilities, and playground. Park property was the site of Hotel Victory
    (opened 1892, destroyed by fire 1919; remnants in campground). Small glacial grooves
    in campground. Hotel Victory Site (Ohio Historic Site #11) within park. Island
    accessible by ferry from Port Clinton, Catawba Island, Sandusky, and Kelleys Island.'
  features_raw: 'Cobble beach; boat ramp; fishing pier; campground (126 sites, 3 cabents);
