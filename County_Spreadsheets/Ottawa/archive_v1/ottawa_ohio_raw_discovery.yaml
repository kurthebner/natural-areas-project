    Ohio Historic Site #3) is the oldest continuously-operating lighthouse on the
    Great Lakes and the centerpiece of the park. The park offers picnicking, fishing
    along the limestone bedrock shore, scenic views of Kelleys and South Bass islands
    and Cedar Point Amusement Park, an ADA handicapped-accessible paved path to the
