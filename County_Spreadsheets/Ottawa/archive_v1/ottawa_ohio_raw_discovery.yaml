    training facility on Lake Erie. Named in honor of Commander Oliver Hazard Perry
    (Battle of Lake Erie, 1813). Features the largest outdoor rifle range in the world.
    Hosts annual shooting matches and NRA National Outdoor Rifle & Pistol Championships.
    Publicly accessible areas include: a swimming beach, fishing pier, restrooms (Camp
    Perry Beach — accessed via Camp Perry Lodging & Conference Center on Lawrence
    Road), a museum, and self-guided tours with interpretive signage. Public entrance
    is on Niagara Road, north of SR 2/SR 358 intersection.'
