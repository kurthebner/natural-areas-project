- entity_type: Site
  name_raw: Confederate Stockade Cemetery
  counties_raw:
  - Ottawa
  county_primary: Ottawa
  ownership_raw: Federal
  governance_raw: U.S. Department of Veterans Affairs / National Cemetery Administration
  partner_agencies_raw: ''
  coordination_raw: ''
  acres_raw: approximately 1
  location_raw: 'Johnson''s Island, Danbury Township, Ottawa County, Ohio; mailing
    address: Johnson''s Island, Sandusky, OH 44870'
  description_raw: The Confederate Stockade Cemetery is located on Johnson's Island
    in Sandusky Bay, approximately 3 miles from the city of Sandusky. Johnson's Island
    was the site of a prisoner-of-war camp for Confederate officers captured during
    the American Civil War. The cemetery contains 206 graves of Confederate prisoners
    who died during their captivity. In 1910, the United Daughters of the Confederacy
    erected a bronze statue, approximately 19 feet tall, titled 'The Lookout,' sculpted
    by Moses Ezekiel. The cemetery is listed in the VA National Cemetery Administration
    directory as a national cemetery. Burial space is closed (no new interments).
  features_raw: 206 graves; iron fence perimeter; marble headstones; 19-ft bronze
    statue 'The Lookout' (UDC, 1910); historically significant Civil War POW site
  gps_lat_raw: ''
  gps_lon_raw: ''
  urls_raw:
  - https://www.cem.va.gov/cems/lots/Confederate_Stockade.asp
  - https://www.cem.va.gov/find-cemetery/state.asp?STATE=OH
  - http://johnsonsisland.org/history-pows/civil-war-era/confederate-cemetery/
  identity_notes_raw: 'VA NCA-managed national cemetery on Johnson''s Island, Ottawa
    County (Danbury Township). Address uses ''Sandusky, OH 44870'' mailing but the
    island is physically in Ottawa County, not Erie County (Sandusky is the city;
    the island is across the bay in Ottawa County waters). Phone: 330-335-3069. Burial
    space closed. IMP-111 (v5.5) mandated source.'
  township_raw: ''
  municipality_raw: ''
  discovery_tier: 1
  seeded_from_baseline: false
  baseline_id: ''
