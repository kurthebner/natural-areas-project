    in the southwestern quadrant of North Bass Island (Isle St. George). Fronts one-half
    mile of publicly accessible Lake Erie shore including one-quarter mile of beach
    along Manila Bay. Bound by North Bass Island State Park to the north, east, and
    southwest. Fox's Marsh (a 60-acre coastal wetland) supports fox snake, Lake Erie
    water snake, waterfowl, migratory shorebird, and songbird populations. Accessible
    for fishing, hunting, wildlife viewing, and paddling. Swimming prohibited. No
    road access — accessible by boat/kayak only.
