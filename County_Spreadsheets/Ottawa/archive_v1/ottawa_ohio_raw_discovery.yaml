- entity_type: Site
  name_raw: Ottawa National Wildlife Refuge
  counties_raw:
  - Ottawa
  - Lucas
  county_primary: Ottawa
  ownership_raw: Federal
  governance_raw: U.S. Fish & Wildlife Service
  partner_agencies_raw: ''
  coordination_raw: ''
  acres_raw: 'more than 8,000 (complex: more than 10,000)'
  location_raw: 14000 West State Route 2, Oak Harbor, Ohio 43449; 15 miles east of
    Toledo, 16 miles west of Port Clinton on State Route 2
  description_raw: Established in 1961, Ottawa National Wildlife Refuge protects a
    network of wetlands, grasslands and forests to provide habitat for a variety of
    migratory birds, resident wildlife and threatened and endangered species. This
    network of land covers more than 8,000 acres and when combined with the other
    refuges in the complex, protects more than 10,000 acres. It has been recognized
    with global significance for its value to wildlife.
  features_raw: Visitor center; Wildlife Drive (7-mile auto tour route); 16 named
    hiking trails; parking; birding; hunting (seasonal); photography
  gps_lat_raw: 41.6074975
  gps_lon_raw: -83.209608
  urls_raw:
  - https://www.fws.gov/refuge/ottawa
  - https://www.fws.gov/refuge/ottawa/visit-us/trails
  - https://www.fws.gov/refuge/ottawa/visit-us/locations
  - https://www.fws.gov/refuge/ottawa/map
  identity_notes_raw: 'KNOWN_MC: No existing DB ID — multi-county entity spanning
    Ottawa and Lucas. Main unit in Ottawa County. Metzger Marsh Unit (182 ac) is in
    Lucas County — co-managed with Ohio Division of Wildlife. Complex also manages
    Cedar Point NWR (Lucas) and West Sister Island NWR (Lucas). Ottawa NWR itself
    is primarily Ottawa County; CROSS_COUNTY_CANDIDATE for Ottawa/Lucas due to Metzger
    Marsh co-management. Baseline seed confirmed.'
  township_raw: ''
  municipality_raw: ''
  discovery_tier: 1
  seeded_from_baseline: true
  baseline_id: Ottawa National Wildlife Refuge
- entity_type: Site
  name_raw: Ottawa National Wildlife Refuge — Navarre Marsh Unit
  counties_raw:
  - Ottawa
  county_primary: Ottawa
  ownership_raw: Federal — complex land exchange history; managed by USFWS
  governance_raw: U.S. Fish & Wildlife Service / Ottawa National Wildlife Refuge
  partner_agencies_raw: ''
  coordination_raw: ''
  acres_raw: approximately 820 (original; current managed acreage unconfirmed)
  location_raw: Approximately 5 miles east of the main Ottawa NWR refuge, near Davis-Besse
    Nuclear Power Station, Ottawa County, Ohio
  description_raw: Navarre Marsh unit is managed by Ottawa National Wildlife Refuge
    staff. The original Navarre Marsh land was traded to Toledo Edison Power Company
    in 1966 in exchange for Darby Marsh; the 820-acre marsh area became the site of
    the Davis-Besse Nuclear Power Station. The unit is not open to the public and
    is accessible by permit only or during special tours.
  features_raw: Restricted access; permit required; birding tours by special arrangement
  gps_lat_raw: ''
  gps_lon_raw: ''
  urls_raw:
  - https://www.fws.gov/refuge/ottawa
  - https://birdinghotspots.org/hotspot/L679575
  identity_notes_raw: Unit of Ottawa NWR. Restricted access — permit or special tour
    only. Land exchange with Toledo Edison 1966 means ownership is complex; USFWS
    manages under agreement. Baseline seed listed as 'Navarre Marsh National Wildlife
    Refuge' — this is the same entity; the NWR designation applies to the managed
    unit. Not the same as Navarre Marsh GNIS swamp feature. Verify governance/ownership
    details at normalization.
  township_raw: ''
  municipality_raw: ''
  discovery_tier: 1
  seeded_from_baseline: true
  baseline_id: Navarre Marsh National Wildlife Refuge
