    Middle harbors (wetland marshes). Middle Harbor is a game sanctuary. Offers 11
    hiking trails plus multi-use trail totaling more than 10 miles, 571-site campground
    with amphitheater and nature center, two boat launches (marina and campground
    ramp), ADA accessible beach areas, fishing, swimming, birding, boating. Campground
