  description_raw: 'Largest known mature forest in northwest Ohio; home to numerous
    rare plant and animal species. Multiple forest community types depending on elevation:
    oak-hickory on highest/driest sites grading to beech-maple, beech-oak-red maple,
    and maple-ash-oak swamp communities. Large trees of many species including white,
    yellow, red, and bur oaks, beech, white ash, shagbark hickory, red maple, sugar
    maple, and sycamore. Substantial buttonbush swamps inundated for most of the year.
    Heart-leaf plantain (Plantago cordata), an Ohio endangered species known from
    only three state sites, occurs here. Excellent for birding and spring wildflowers.'
  habitat_type_raw: Old-growth/mature upland forest (oak-hickory, beech-maple); buttonbush
    swamp wetlands; spring wildflower groundlayer
  features_raw: 1.1-mile accessible boardwalk; hiking; birding; summer and spring
    wildflowers; wetlands; woods
  access_notes_raw: Open 1/2 hour before sunrise to 1/2 hour after sunset. Stay on
    designated trails. Pets not permitted. No restrooms.
  location_raw: 13278 County Road 190, Kenton, OH 43326; approximately 4 miles south
    of Kenton
