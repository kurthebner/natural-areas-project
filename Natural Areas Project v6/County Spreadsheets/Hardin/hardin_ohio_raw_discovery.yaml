  partner_agencies_raw: Ducks Unlimited; Pheasants Forever; USDA Wetlands Reserve
    Program; H2Ohio program (Wyandot County portion)
  coordination_raw: null
  description_raw: 'Approximately 861-acre wildlife area spanning Hardin and Wyandot
    counties. Consists of two Hardin County tracts (north: 584 acres; south: 135 acres)
    plus an H2Ohio-funded Wyandot County addition. All tracts are former agricultural
    land restored through the USDA Wetlands Reserve Program. Habitat includes restored
    wetlands, native warm-season grassland, and a 36-acre woodlot on the south tract.
    Northern site just south of Forest; southern site south of Kenton adjacent to
    the Lawrence Woods complex. Dedicated October 5, 2019. Named for Alexander Andreoff
    of Pheasants Forever. The H2Ohio Wyandot County portion is open to public wildlife
    viewing, hunting, and trapping.'
  habitat_type_raw: Restored wetlands; native warm-season grassland/prairie; woodlot
    (36 acres on south tract)
  features_raw: Hunting; trapping; wildlife viewing; waterfowl habitat
  access_notes_raw: Two separate Hardin County tracts with different road access.
    H2Ohio Wyandot County portion also publicly accessible.
  location_raw: 'North tract: County Road 205 and Township Road 50, just south of
