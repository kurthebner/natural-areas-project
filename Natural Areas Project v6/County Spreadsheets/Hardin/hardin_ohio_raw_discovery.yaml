  description_raw: 26-acre county park district property centered on Boy Scout Lake
    (4.1 acres). Created July 30, 1946 by order of the Hardin County Probate Court;
    governed by Board of Park Commissioners appointed by the Probate Judge. District
    covers Buck, Cessna, Goshen, Lynn, Pleasant, and Washington Townships plus the
    City of Kenton. Features a 4.1-acre fishing lake (no license required), paved
    walking path, dog run, children's playground, and three shelter houses. Entirely
    handicap accessible. First paved walking path segment completed 2009.
