  description_raw: 25-acre educational and natural area managed by the Hardin SWCD
    on the north side of State Route 67 approximately 2-3 miles west of Kenton. Features
    a wooded area with paved handicap-accessible trail leading to a small wetland
    with bridge access. Mowed walking paths continue beyond the wetland to a shelter
    house and throughout the property. Self-guided nature trail with markers identifying
    trees and plants. Scenic woodlands, meadow, and streamlet. Used for environmental
    education (4-H groups, school programs). Named for Silver Creek which flows through
    or near the property.
