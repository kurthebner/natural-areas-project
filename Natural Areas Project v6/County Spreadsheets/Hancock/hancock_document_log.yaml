    description: >
      Blanchard River Water Trail Map Guide (Hancock Park District + ODNR). 37.6-mile
      designated water trail from Blanchard River Nature Preserve to Blanchard Landing,
      entirely within Hancock County. 11 access points with GPS coordinates. Published
      by Hancock Park District (hancockparks.com).
    source_url: "https://dam.assets.ohio.gov/image/upload/odnr/watertrails/BlanchardRiverMapGuide.pdf"
    notes: >
      Pre-staged before Hancock County discovery run. Obtained during Hardin County
      ODNR Water Trails research (2026-06-11). The Blanchard River originates in Hardin
      County but the designated water trail is entirely in Hancock County. This PDF is
      the authoritative access point inventory for Tier 3 discovery (Hancock Park District
      manages the trail cooperatively with ODNR). Key entities to catalog:
        - Blanchard River Water Trail (Trailthing, T3, Hancock Park District)
        - 11 access points with published GPS
