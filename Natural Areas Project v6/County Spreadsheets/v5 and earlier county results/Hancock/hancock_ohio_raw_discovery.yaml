    American camp along the "big bend" of the Blanchard, the 129-acre park remains
    a unique habitat for wildlife. Visitors can birdwatch and take photographs as
    they enjoy a wide range of year-round outdoor recreation opportunities and experiences.
    Ample open space is available for yard games. A multi-use loop trail and nature
    trails weave through clearings and tree canopy, perfect for quiet dreaming and
    restful solitude for every season.
