  identity_notes_raw: 'Named loops: Green Trail (1 mi), Blue Trail (2 mi), Orange
    Trail (2 mi), Haiku Trail (0.2 mi), Sensory Trail (0.1 mi), Pink Trail (4 mi),
    Red Trail (2 mi), White Trail (1 mi), Yellow Trail (2 mi). Trailhead at south
    side parking lot. These named loops likely qualify as Trail Segments; resolve
    in normalization. Van Buren State Park Map (downloadable) available — may contain
    segment geometry. Map rev. 10/2025 shows corrected loop lengths: Pink=2.6mi, White=1.5mi,
    Orange=1.0mi. Purple Trail (0.3mi Easy) also documented on map — previously missing.
    Campground Connector (0.1mi Mod), Day Use Connector (0.1mi Easy), Cable Line Road
    Trail also shown. Sensory Trail (0.2mi) appears on map body.'
