  name_raw: Van Buren State Park
  counties_raw:
  - Hancock
  county_primary: Hancock
  ownership_raw: State of Ohio / ODNR
  governance_raw: ODNR Division of Parks & Watercraft
  partner_agencies_raw: Friends of Van Buren State Park
  coordination_raw: null
  acres_raw: '296'
  address_raw: 12259 Township Road 218, Van Buren, OH 45889
  phone_raw: (419) 832-7662
  gps_lat_raw: '41.13268422129203'
  gps_lon_raw: '-83.62390670323607'
  location_raw: North of Findlay, Van Buren Township, Hancock County, Ohio
  description_raw: Originally inhabited by the Shawnee, the area surrounding Van Buren
    State Park is rich in woods and agricultural lands. The park's 296 acres offer
    a calm, peaceful retreat with camping, fishing, hiking, horseback riding, and
    picnicking opportunities that can be enjoyed year-round.
  features_raw: Camping (61 sites, 50-amp electricity & water, tent camping, pets
    allowed, partial shade); Dog Park (fenced, south side); Disc Golf (18-hole, free);
    Fishing (largemouth bass, channel catfish, crappie, bullhead, bluegill, carp;
    Ohio license required); Hunting (archery only east of Township Road 229); Picnicking
    (several areas); Reservable Shelterhouses (3, reserve online or call 866-644-6727);
    Hiking trails; Mountain bike trails (3 miles); Bridle trails; 3D Archery range;
    Volleyball courts; Horseshoe pits; Playground; Sledding (winter)
  category_raw: State Park
  designation_raw: null
  urls_raw:
  - https://ohiodnr.gov/go-and-do/plan-a-visit/find-a-property/van-buren-state-park
  identity_notes_raw: 'GPS from ODNR page JS (window.odnrCurrentPropLat/Long) — treat
    as authoritative until GPS Acquisition pass confirms. Note (Aug 2025): Dam Notching
    and Water Level Lowering underway for Rocky Ford Creek Restoration; lake not navigable.
    Baseline seed confirmed: Van Buren State Park. Baseline also listed "Van Buren
    Lake Trail" — not explicitly named on current ODNR page; may be renamed or discontinued;
    verify. Bridle Camp (overnight horse camping) — not confirmed on current ODNR
    page; baseline listed separately; verify via reservation system.'
  township_raw: ''
  municipality_raw: ''
  discovery_tier: 2
