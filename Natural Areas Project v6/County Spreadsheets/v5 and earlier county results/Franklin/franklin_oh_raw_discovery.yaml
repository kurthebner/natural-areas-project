# TIER 3 — IMPROVEMENT FLAGS
tier_3_improvement_flags:
  - issue: "Metro Parks trail inventory scope"
    description: >
      The Metro Parks system has 230+ miles of trails across 20 parks — far exceeding what
      can be researched in a single discovery session. This session documented 3 major multi-park
      trails and flagged per-park inventories as incomplete. Recommend: dedicated sub-session or
      batch approach for per-park trail documentation before advancing to Tier 4. This is a
      scale challenge specific to large park districts.
  - issue: "Rails-to-trails multi-governance tier assignment"
    description: >
      Camp Chase Trail and Heritage Trail cross multiple governance tiers (Metro Parks + Columbus
      Recreation and Parks + cities). Discovery protocol does not specify how to assign tier for
      multi-governance trails. Decision: record at Tier 3 (Metro Parks is primary natural areas
      manager for these corridors); flag for normalization review. Recommend adding rule to
      discovery protocol: for rails-to-trails corridors, tier = highest natural areas governance
      tier present, with all managers documented in governance/coordination fields.
  - issue: "Child site designation tier vs. management tier"
    description: >
      Edward S. Thomas State Nature Preserve is inside Sharon Woods Metro Park and has ODNR
      state nature preserve designation. It was placed at Tier 3 (management tier) consistent
      with the NNL ruling from Tier 1. However, the baseline listed it as "State Nature Preserve"
      suggesting prior expectation of Tier 2 assignment. Confirmed: management tier governs.
      Protocol should explicitly state this rule applies to all designation types (NNL, NHA,
      state nature preserve, national scenic river, etc.).
  - issue: "IMP-023 — B067 baseline ID collision (RESOLVED 2026-03-18)"
    description: >
      ORIGINAL NOTE (erroneous): Both Blacklick Woods Metro Park (Site 2) and Blendon Woods
      Metro Park (Site 3) were assigned baseline_id B067, which is a collision error.
      The original self-diagnosis note incorrectly concluded that B067 belonged to Blacklick
      Woods and that Blendon Woods had no baseline entry.
      CORRECTION: Baseline spreadsheet audit revealed the actual assignments:
        B065 = "Blacklick Woods" (National Natural Landmark, 63ac) — NNL sub-entity inside
               Blacklick Woods Metro Park; the full metro park had no separate baseline entry.
        B066 = "Blendon Woods Metro Park" (Metro Parks, 653ac) — direct match for Site 3.
        B067 = "Blodwen Park" (Grove City City Park, 0.5ac) — unrelated; was wrongly assigned
               to both metro parks.
      APPLIED FIX: Site 2 (Blacklick Woods MP) → baseline_id B065; Site 3 (Blendon Woods MP)
      → baseline_id B066. DB provenance and TSV notes updated. See Session 15 log.



