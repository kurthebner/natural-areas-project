    (3) Canal Street boundary documented by multiple sources: "at Delphos the canal is now the
        boundary between Allen and Van Wert counties"
    (4) Delphos Gillmor Reservoir (walking trail, 30 ac) also in Allen County

    Van Wert County portion of Delphos (Washington Township side) is residential only — no parks.
