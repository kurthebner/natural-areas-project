    eastern portion, ~70% of city population) and Van Wert County (Washington Township, western
    portion, ~30%). The Miami-Erie Canal (now Canal Street) is the county boundary within Delphos.
    East of the canal = Allen County; west of the canal = Van Wert County.

    All five Delphos city parks are in Allen County (Marion Township):
    - Stadium Park (1101 N Jefferson St, 30 ac): CONFIRMED Allen County via ohiostadiums.com
    - Waterworks Park (600 Spencerville Rd, 18 ac): east side of city = Allen County
    - Leisure Park (Lima Ave, 20 ac): north commercial corridor = Allen County
    - Garfield Park (South Clay St, 5 ac): Allen County
    - Suever Park (South Clay St, 8 ac): Allen County

