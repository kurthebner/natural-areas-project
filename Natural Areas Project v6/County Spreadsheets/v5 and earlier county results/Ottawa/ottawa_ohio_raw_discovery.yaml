  counties_raw:
  - Ottawa
  county_primary: Ottawa
  ownership_raw: City of Port Clinton
  governance_raw: City of Port Clinton
  partner_agencies_raw: ''
  coordination_raw: ''
  gps_lat_raw: ''
  gps_lon_raw: ''
  location_raw: W. Second St., Port Clinton, OH 43452
  acres_raw: ''
  description_raw: Originally gifted to the City of Port Clinton in 1933, Veterans Memorial Park stands as a tribute to those
    who give the most they have to offer. The park is dedicated to the memory of the 37th Tank Company of the Port Clinton
    National Guard, who served as Company C from the 192nd Tank Battalion during World War II. The men of Company C were taken
    prisoner while defending the Bataan Peninsula in 1942 and were held until their liberation in 1945. Only 10 men of the
    original 32 sent to the Bataan Peninsula survived. There are visual testimonials of military service throughout the park.
    A restored World War II M5 anti-tank gun guards the south entrance and a M-42 'Duster' tank guards the north entrance.
    The Fallen Soldier Battlefield Cross adorns one side of the park while an Eternal Flame lights the other.
  features_raw: World War II military history, Fallen Soldier Battlefield Cross, Eternal Flame, M5 anti-tank gun, M-42 Duster
    tank, gardens, benches
  urls_raw:
  - https://www.portclinton.com/business_detail_T30_R27.php
  identity_notes_raw: Name on website is 'Veterans Park'; description refers to it as 'Veterans Memorial Park'. Normalization
    to reconcile.
