  description_raw: Great Egret Marsh Preserve consists of more than 150 acres of marsh and surrounding upland in Ottawa County,
    across the road from East Harbor State Park. The preserve's marshes are part of the West Harbor Basin, a long, narrow
    pool of Lake Erie backwater that geologists believe was once the channel of the Portage River. Created in 2013 with help
    from a Clean Ohio Conservation Fund grant, the preserve contributes to TNC's goal to protect and restore an additional
    10,000 acres of coastal habitat along Lake Erie.
