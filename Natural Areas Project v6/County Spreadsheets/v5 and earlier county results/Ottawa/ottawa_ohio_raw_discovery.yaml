  description_raw: Host to the annual Walleye Festival, Waterworks Park is nestled along the picturesque shores of Lake Erie.
    It is a beloved urban oasis that combines natural beauty with recreational opportunities. Expansive green spaces invite
    visitors to experience its serene atmosphere through leisurely walks, engaging picnics, and family gatherings. The well-maintained
    pathways meander through vibrant flower beds and towering trees, making it an ideal spot for nature lovers and photographers
    alike. One of the highlights of the park is the stunning Port Clinton Lighthouse, where you can enjoy guided tours of
    one of the region's most historical markers. Whether you're interested in birdwatching, jogging, or simply unwinding by
    the water, the park caters to all kinds of outdoor enthusiasts. Families will appreciate the ample space for children
    to play and explore, making it a perfect destination for a day out. The covered picnic area can be reserved for groups.
  features_raw: restrooms, covered picnic areas, walking trails, benches, Port Clinton Lighthouse, sculptures, gardens, fountains,
    historical markers, fishing pond, fishing pier, public dock, dogs allowed on-leash
