  description_raw: The Mosie Nesbit Johnson Garden is on the former site of the First Baptist Church, the first African American
    church in Port Clinton. Mosie Nesbit Johnson was a civil rights activist and the leader of the NAACP Port Clinton chapter
    for 25 years. When the church was demolished in 2011 the City of Port Clinton installed the garden and named it in her
    honor. There is a plaque in the garden that pays homage to the church's historical significance. The garden is managed
    by the Friends of Port Clinton Parks and is open to all members of the community. The pathways in the garden were made
    wide enough to accommodate anyone who might have mobility challenges. There are 25 all organic raised beds that can be
    rented out, with a one-time fee of $25 for each bed.
