  description_raw: Veterans Memorial Park was established in 1946, and remains the largest recreational park in the Genoa
    area. The Village of Genoa operates and maintains the 45-acre park under the direction of the Village Administrator and
    Park Director. Located on Washington Street near downtown Genoa, the park has baseball fields, tennis courts, basketball
    courts, soccer fields, a frisbee golf course, a half-pipe, and a separate swimming facility (the Genoa Quarry). The North
    Coast Inland Trail (NCIT) was extended into Veterans Park in 2020, and provided a separated active use trail connecting
    Genoa to Elmore, Lindsey, Fremont, and beyond. In addition to the activities-related offerings, Veterans Park includes
    plenty of space for relaxation.
