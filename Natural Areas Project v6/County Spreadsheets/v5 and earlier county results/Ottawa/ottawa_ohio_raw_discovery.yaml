  description_raw: The Genoa Quarry has been a mainstay in summer entertainment for residents and neighbors in surrounding
    communities for over one hundred years. A spring-fed water hole, the quarry spans nearly a quarter mile around and is
    100 feet deep in some parts. The Quarry is part of the 45-acre Veterans Memorial Park. The Quarry is staffed by a host
    of lifeguards certified by the Red Cross. The quarry's beach allows for younger children to enjoy the water without being
    near cliff edges. Clear, cool clean water and plenty of beach area contribute to making the Genoa Quarry an excellent
    place to spend a hot, summer day.
