  location_raw: Approximately 5 miles east of the main Ottawa NWR refuge, near Davis-Besse Nuclear Power Station, Ottawa County,
    Ohio
  description_raw: Navarre Marsh unit is managed by Ottawa National Wildlife Refuge staff. The original Navarre Marsh land
    was traded to Toledo Edison Power Company in 1966 in exchange for Darby Marsh; the 820-acre marsh area became the site
    of the Davis-Besse Nuclear Power Station. The unit is not open to the public and is accessible by permit only or during
    special tours.
  features_raw: Restricted access; permit required; birding tours by special arrangement
