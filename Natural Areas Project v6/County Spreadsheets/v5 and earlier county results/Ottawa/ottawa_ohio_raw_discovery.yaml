  location_raw: South Bass Island, Put-in-Bay, OH 43456; mailing address PO Box 549, Put-in-Bay, OH 43456
  description_raw: Perry's Victory and International Peace Memorial is located on South Bass Island in Ohio. It features a
    352-foot Doric column that is the only international peace memorial in the National Park System. The Memorial was established
    to honor those who fought in the Battle of Lake Erie during the War of 1812, and to celebrate the long-lasting peace among
    Great Britain, Canada and the U.S. The plaza, rotunda, and observation deck are inaccessible for the 2026 and 2027 seasons
    due to Upper Plaza Rehabilitation.
  features_raw: 352-foot Doric column; visitor center; observation deck (closed 2026-2027 for rehabilitation); memorial rotunda
    (free admission); ranger programs; exhibits; 15-minute orientation video
