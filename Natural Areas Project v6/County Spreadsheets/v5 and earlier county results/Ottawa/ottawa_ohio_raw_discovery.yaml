  identity_notes_raw: 'KNOWN_MC: No existing DB ID — multi-county entity spanning Ottawa and Lucas. Main unit in Ottawa County.
    Metzger Marsh Unit (182 ac) is in Lucas County — co-managed with Ohio Division of Wildlife. Complex also manages Cedar
    Point NWR (Lucas) and West Sister Island NWR (Lucas). Ottawa NWR itself is primarily Ottawa County; CROSS_COUNTY_CANDIDATE
    for Ottawa/Lucas due to Metzger Marsh co-management. Baseline seed confirmed.'
