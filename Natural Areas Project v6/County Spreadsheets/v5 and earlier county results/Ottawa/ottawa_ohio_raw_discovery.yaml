  location_raw: 14000 West State Route 2, Oak Harbor, Ohio 43449; 15 miles east of Toledo, 16 miles west of Port Clinton on
    State Route 2
  description_raw: Established in 1961, Ottawa National Wildlife Refuge protects a network of wetlands, grasslands and forests
    to provide habitat for a variety of migratory birds, resident wildlife and threatened and endangered species. This network
    of land covers more than 8,000 acres and when combined with the other refuges in the complex, protects more than 10,000
    acres. It has been recognized with global significance for its value to wildlife.
  features_raw: Visitor center; Wildlife Drive (7-mile auto tour route); 16 named hiking trails; parking; birding; hunting
    (seasonal); photography
  gps_lat_raw: 41.6074975
