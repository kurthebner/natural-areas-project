  description_raw: Stone Laboratory is Ohio State University's Lake Erie campus and the oldest freshwater biological field
    station in the United States (established 1895). The main campus is on Gibraltar Island (within Put-in-Bay Harbor). The
    Peach Point campus on South Bass Island provides publicly accessible facilities including paved walkways, a public fishing
    dock, fishing equipment to borrow, bait, courtesy docks, small picnic area, and benches. The Put-in-Bay Aquatic Visitor
    Center (fully renovated 2024) is here and offers free hands-on exhibits on fish species, fisheries management, and invasive
    species. The Federal Fish Hatchery on Peach Point was transferred to OSU in 1940.
