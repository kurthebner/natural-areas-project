  description_raw: 'East Harbor State Park is a 1,831-acre state park in Danbury Township on a peninsula along Lake Erie.
    Features sandy beaches, wooded areas, East and Middle harbors (wetland marshes). Middle Harbor is a game sanctuary. Offers
    11 hiking trails plus multi-use trail totaling more than 10 miles, 571-site campground with amphitheater and nature center,
    two boat launches (marina and campground ramp), ADA accessible beach areas, fishing, swimming, birding, boating. Campground
    has glacial grooves. Lockwood (Marshall) Cemetery (Ohio Historic Site #37) is located within the park. Marina provides
    seasonal dockage on West Harbor.'
