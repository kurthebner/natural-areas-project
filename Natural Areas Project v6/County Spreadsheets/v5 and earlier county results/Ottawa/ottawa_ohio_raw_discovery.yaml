  location_raw: Narrow peninsula extending south from Marblehead Peninsula into Sandusky Bay, Ottawa County, Ohio
  acres_raw: '68'
  description_raw: An iconic reminder of the Great Lakes' rich natural heritage, the 68-acre Bay Point property along the
    Lake Erie shore has been acquired by Western Reserve Land Conservancy. Known locally as the 'Sandbar,' the Ottawa County
    property consists of a narrow peninsula that extends south from the Marblehead Peninsula into Sandusky Bay. The northern
    portion of the property is more stable and contains mature trees along with extensive forested wetlands. The southern
    portion is seemingly under constant change by shifting sands and wave activity, comprising beaches, sandbars, small sand
    dunes, as well as coastal wetlands.
  features_raw: 34-acre freshwater coastal wetland; ~2.5 miles undisturbed Lake Erie shoreline; forested wetlands; mature
    trees; beaches; sandbars; small sand dunes; coastal wetlands; 80+ bird species including 7 species of concern
  urls_raw:
  - https://wrlandconservancy.org/bay-point-sandbar-property-acquired-set-to-be-permanently-conserved/
  url_primary_raw: https://wrlandconservancy.org/bay-point-sandbar-property-acquired-set-to-be-permanently-conserved/
  identity_notes_raw: 'Also known locally as ''the Sandbar.'' Acquired Dec 28, 2017 by WRLC. Contains last remaining undisturbed
    coastal wetlands of the historic Great Black Swamp. Public access: boaters may anchor offshore; no land-based public access
    as of 2018 article. Snowy plover observed Sept 2010. Species of concern: common tern, great egret, magnolia warbler, blackburnian
    warbler, brown creeper, dark-eyed junco, green-winged teal.'
