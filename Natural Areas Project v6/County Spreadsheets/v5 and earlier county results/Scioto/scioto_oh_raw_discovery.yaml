description_raw: "Located in the unglaciated hill country of south central Ohio, Brush Creek State Forest was established in 1928 with the acquisition of 285 acres of land. This and other early land acquisitions were originally part of Shawnee State Forest. As acreage and distances grew, the need to form a separate state forest unit became apparent in order to properly manage these scattered land holdings. In the early 1950s, a new state forest was formed and drew its name from a major stream in the area known as Scioto Brush Creek. Formerly, the forest headquarters and service center were established along State Route 73 about one mile west of the village of Rarden in western Scioto County. Today, Brush Creek State Forest comprises well over 13,000 acres of productive hardwood forest land. The vast majority of these acres is made up of steep hillsides, deep hollows, and narrow ridge tops."
features_raw: "Hunting; Hiking; Horseback riding; Mushroom and berry picking; Historical stone quarries; Stone Quarry trail; Coffee Hollow & Crabtree Cemetery bridle trail; Wildlife viewing; Forest roads"
