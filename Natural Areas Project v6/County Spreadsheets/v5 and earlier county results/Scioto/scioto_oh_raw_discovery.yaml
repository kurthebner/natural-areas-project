features_raw: "Backpacking; Hiking; Horseback riding; Mountain biking; Hunting; Fishing; Dispersed camping; Horsemen's campground (20 sites near Bear Lake); Wildlife viewing; Wilderness area (~8,000 ac); Bridle trails (60+ mi)"
